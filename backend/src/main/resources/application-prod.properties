# Perfil de producción (activar con SPRING_PROFILES_ACTIVE=prod al desplegar)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Compresión gzip para respuestas JSON/estáticas en móviles
server.compression.enabled=true
server.compression.min-response-size=1024

# No exponer códigos de verificación ni detalles internos en producción
app.auth.expose-demo-codes=false
# En v1.0 oficial exigir verificación real por correo (se puede sobreescribir vía env var)
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Respeta cabeceras X-Forwarded-* cuando esté detrás de proxy inverso
server.forward-headers-strategy=framework
