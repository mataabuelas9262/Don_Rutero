# Puerto de la aplicación
server.port=${PORT:8080}

# Configuración de Base de Datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ruta_bus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.sql.init.mode=always
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Manejo seguro de errores HTTP
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Configuración de carga y tamaño de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Clave secreta para firmar los JWT (si se deja vacía en local, JwtTokenProvider genera una clave aleatoria efímera)
jwt.secret=${JWT_SECRET:}
# Expiración del token: 1 día (86400000 ms)
jwt.expiration=86400000

# CORS y modo de verificación
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*}
# En producción real con SMTP configurado, definir EXPOSE_DEMO_CODES=false
app.auth.expose-demo-codes=${EXPOSE_DEMO_CODES:true}
# En beta sin SMTP se puede poner REQUIRE_EMAIL_VERIFICATION=false para registro directo
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}
