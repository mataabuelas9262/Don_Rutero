# Puerto de la aplicación
server.port=${PORT:8080}

# Configuración de Base de Datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ruta_bus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.sql.init.mode=always
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Manejo seguro de errores HTTP y proxy headers (Cloudflare/Nginx)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=framework

# Configuración de carga y tamaño de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Clave secreta para firmar los JWT (si se deja vacía en local, JwtTokenProvider genera una clave aleatoria efímera)
jwt.secret=${JWT_SECRET:}
# Expiración del token: 1 día (86400000 ms)
jwt.expiration=86400000

# CORS y modo de verificación
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*}
# En producción real con SMTP configurado, definir EXPOSE_DEMO_CODES=false
app.auth.expose-demo-codes=${EXPOSE_DEMO_CODES:true}
# En beta sin SMTP se puede poner REQUIRE_EMAIL_VERIFICATION=false para registro directo
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}
# Validación DNS MX del dominio de correo en registro y envío de códigos
app.auth.verify-email-mx=${VERIFY_EMAIL_MX:true}

# Configuración SMTP opcional (Resend / Brevo / Gmail SMTP en producción o pruebas locales)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_FROM:}

# Tráfico en tiempo real (opcional TomTom API Key; sin clave usa telemetría comunitaria + perfil horario de Mazatlán)
app.traffic.tomtom-api-key=${TOMTOM_API_KEY:}
app.traffic.tomtom-tile-ttl-ms=${TOMTOM_TILE_TTL_MS:90000}
app.traffic.tomtom-flow-ttl-ms=${TOMTOM_FLOW_TTL_MS:360000}
