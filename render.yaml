services:
  - type: web
    name: don-rutero
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/routes
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EXPOSE_DEMO_CODES
        value: "false"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: JPA_DDL_AUTO
        value: validate
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
